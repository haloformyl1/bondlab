<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08111f">
  <title>Student Login — BondLab</title>
  
  <!-- EmailJS script -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
      (function() {
          emailjs.init("ZMyiGn4yoqfC3P74Q");
      })();
  </script>
  
  <style>
    :root {
      --bg: #06101d;
      --bg-2: #0a1730;
      --panel: rgba(14, 31, 55, .74);
      --line: rgba(165, 214, 255, .16);
      --text: #edf8ff;
      --muted: #a9bfd2;
      --cyan: #46e3ff;
      --amber: #ffc75a;
      --danger: #ff7c8c;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      background: linear-gradient(145deg, var(--bg), var(--bg-2) 48%, #06101c);
    }
    
    .login-container {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .28);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.8rem;
    }

    p {
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--cyan);
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--cyan);
      color: #03101c;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      color: var(--danger);
      background: rgba(255, 124, 140, 0.1);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      display: none;
    }

    #step2 {
      display: none;
    }
    
    .back-btn {
      background: transparent;
      color: var(--muted);
      width: auto;
      padding: 0;
      font-size: 0.9rem;
      margin-bottom: 16px;
      text-align: left;
    }
    .back-btn:hover {
      color: var(--text);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h1>Student Login</h1>
    <p id="subtitle">Verify your email to access the lab</p>

    <div class="error-msg" id="errorMsg"></div>

    <!-- Step 1: Email -->
    <form id="step1" onsubmit="handleSendOtp(event)">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="emailInput" placeholder="student@university.edu" required>
      </div>
      <button type="submit" id="sendBtn">Send Verification OTP</button>
    </form>

    <!-- Step 2: OTP -->
    <form id="step2" onsubmit="handleLogin(event)">
      <button type="button" class="back-btn" onclick="goBack()">← Back</button>
      <div class="form-group">
        <label>6-Digit OTP</label>
        <input type="text" id="otpInput" maxlength="6" placeholder="••••••" required style="letter-spacing: 0.5em; text-align: center; font-family: monospace;">
      </div>
      <button type="submit" id="loginBtn">Access Laboratory</button>
    </form>
  </div>

  <script>
    let generatedOtp = '';
    let userEmail = '';

    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const errorMsg = document.getElementById('errorMsg');
    const subtitle = document.getElementById('subtitle');
    const sendBtn = document.getElementById('sendBtn');

    function generateOTP() {
      return Math.floor(100000 + Math.random() * 900000).toString();
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }

    function hideError() {
      errorMsg.style.display = 'none';
    }

    function goBack() {
      step2.style.display = 'none';
      step1.style.display = 'block';
      subtitle.textContent = 'Verify your email to access the lab';
      hideError();
    }

    async function handleSendOtp(e) {
      e.preventDefault();
      userEmail = document.getElementById('emailInput').value;
      if (!userEmail) return;

      hideError();
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending OTP...';
      
      generatedOtp = generateOTP();

      try {
        await emailjs.send('service_dzy9m19', 'template_ejptlnn', {
          otp: generatedOtp,
          to_email: userEmail
        });
        
        step1.style.display = 'none';
        step2.style.display = 'block';
        subtitle.innerHTML = `OTP sent to <strong>${userEmail}</strong>`;
      } catch (err) {
        console.error('Failed to send OTP:', err);
        showError('Failed to send OTP. Please try again.');
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send Verification OTP';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const inputOtp = document.getElementById('otpInput').value;
      hideError();

      if (inputOtp !== generatedOtp) {
        showError('Invalid OTP. Please check your email.');
        return;
      }

      // Success! Set session state and redirect to the main app
      localStorage.setItem('bondlab_logged_in', 'true');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
